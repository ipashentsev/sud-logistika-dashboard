<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Логистика участков 1-87</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg-shape bg-1"></div>
  <div class="bg-shape bg-2"></div>

  <header class="topbar">
    <div>
      <h1>Логистика выездов по участкам 1-87</h1>
      <p class="subtitle">Быстрый выбор участка, просмотр на карте и переход в Яндекс.Маршрут</p>
    </div>
    <div class="metrics" id="metrics"></div>
  </header>

  <main class="layout">
    <section class="panel left">
      <div class="controls">
        <label for="search">Поиск участка</label>
        <input id="search" type="text" placeholder="Например: 10 или часть адреса" />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>№</th>
              <th>Адрес</th>
              <th>Км</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <section class="panel right">
      <h2>Маршрут и карта</h2>
      <div class="selected-card" id="selectedCard">
        <div id="selected">Участок не выбран</div>
        <div class="actions">
          <button id="openYandex" disabled>Открыть маршрут в Яндекс.Картах</button>
        </div>
        <p class="hint">Точка отправления фиксирована: метро Купчино, Санкт-Петербург</p>
      </div>
      <div id="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./app.js"></script>
</body>
</html>
